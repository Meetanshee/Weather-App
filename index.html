<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
<div class="back">
    <div class="card">
        <div class="searchBox">
            <input type="text" placeholder="Enter City Name">
            <button type="button"><img src="14270631741548336252.svg" alt="Search"> </button>
        </div>
             <h3 id="invalid">Invalid city</h3>
        <div class="weatherStatus">
            <div class="w1">
                <img src="static/day.svg" alt="day">
                <h1 id="temp"></h1>
                <h1 id="city"></h1>
            </div>
            <div class="w2">
                <div class="humidity">
                    <img src="4996306631548329945.svg" alt="Humidity">
                    <h1 id="dh"></h1>
                    <h1 id="th">Humidity</h1>
                </div>
                <div class="wind">
                    <img src="7501706571674723012.svg" alt="wind">
                    <h1 id="dw"></h1>
                    <h1 id="tw">wind</h1>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="index.js"></script>
</body>
</html>
